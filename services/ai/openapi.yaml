openapi: 3.1.0
info:
  title: LAYERS AI Service
  description: |
    Local desktop AI service for feature extraction, hypothesis generation and
    preset scoring. All models run on-device; no network access is required
    after the model is cached.
  version: 0.1.0
  contact:
    name: LAYERS
    url: https://layers.dev
servers:
  - url: http://127.0.0.1:8123
    description: Local desktop service

x-layers:
  model: CLIP ViT-B/32 (on-device)
  privacy: no-network-after-cache
  budget-gate: services reference packages/schema mobileOk / estimatePasses

paths:
  /v1/health:
    get:
      summary: Health check
      description: Liveness probe. Returns 200 when the service and model are ready.
      operationId: healthCheck
      tags: [system]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Model not loaded yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/features/extract:
    post:
      summary: Extract features from reference images
      description: |
        Run CLIP on one or more reference images and return pooled image
        embeddings plus per-token embeddings for similarity search.
      operationId: extractFeatures
      tags: [features]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureExtractRequest'
      responses:
        '200':
          description: Features extracted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureExtractResponse'
        '400':
          description: Bad request (missing image)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/hypotheses/generate:
    post:
      summary: Generate style hypotheses from features
      description: |
        Given reference features, propose candidate effect-stack hypotheses to
        render and score against the references.
      operationId: generateHypotheses
      tags: [hypotheses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HypothesisRequest'
      responses:
        '200':
          description: Generated hypotheses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/presets/score:
    post:
      summary: Score a preset against reference features
      description: |
        Compute a similarity score for a single effect-stack preset against
        reference image features. Returns cosine similarity and an estimated
        pass budget.
      operationId: scorePreset
      tags: [presets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetScoreRequest'
      responses:
        '200':
          description: Preset scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetScoreResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/vlm/refine:
    post:
      summary: VLM refinement of candidate cores
      description: |
        Simulates a Vision-Language Model refining candidate cores against a
        feature vector. Returns refined candidates with accepted/rejected status,
        updated confidence scores, and VLM notes. This is the mock AI server used
        by Stage 1.5 frontend integration.
      operationId: vlmRefine
      tags: [vlm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VLMRefineRequest'
      responses:
        '200':
          description: Refined candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VLMRefineResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/vlm/regenerate:
    post:
      summary: Regenerate a single layer in a stack
      description: |
        Replaces the layer at the given index with the best-matching candidate
        core, scored by proxy fidelity. Returns the regenerated core, parameters,
        and the resulting stack.
      operationId: vlmRegenerate
      tags: [vlm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature, stack, layer_index]
              properties:
                feature:
                  $ref: '#/components/schemas/FeatureVector'
                stack:
                  type: array
                  items:
                    type: object
                layer_index:
                  type: integer
                max_trials:
                  type: integer
                  default: 50
      responses:
        '200':
          description: Regenerated layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VLMRegenerateResponse'
        '400':
          description: Invalid layer index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/vlm/suggest:
    post:
      summary: Suggest alternative stacks
      description: |
        Returns alternative stacks (each within the 8-pass budget) ranked by
        proxy-fidelity score. These are alternatives to the current stack.
      operationId: vlmSuggest
      tags: [vlm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature, stack]
              properties:
                feature:
                  $ref: '#/components/schemas/FeatureVector'
                stack:
                  type: array
                  items:
                    type: object
                max_suggestions:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Suggested alternatives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VLMSuggestResponse'

  /v1/vlm/optimize:
    post:
      summary: Re-optimize a stack
      description: |
        Runs CMA-ES parameter optimization on the stack and also computes a
        pruned variant for comparison. Returns the optimized stack, score,
        trace, pass count, and pruning report.
      operationId: vlmOptimize
      tags: [vlm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature, stack]
              properties:
                feature:
                  $ref: '#/components/schemas/FeatureVector'
                stack:
                  type: array
                  items:
                    type: object
                max_trials:
                  type: integer
                  default: 200
      responses:
        '200':
          description: Optimized stack and pruning report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VLMOptimizeResponse'

  /v1/style-clusters:
    get:
      summary: Style clusters
      description: Return the canonical list of style-cluster names.
      operationId: getStyleClusters
      tags: [style]
      responses:
        '200':
          description: Style clusters list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleClustersResponse'

  /v1/core-types:
    get:
      summary: Core types
      description: Return the canonical list of core-type identifiers.
      operationId: getCoreTypes
      tags: [style]
      responses:
        '200':
          description: Core types list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTypesResponse'

  /v1/retrieve:
    post:
      summary: Weighted retrieval
      description: |
        Retrieve top-k stacks for a target FeatureVector via weighted retrieval.
        Score = 0.40 * cosine_sim + 0.30 * acceptance_rate + 0.20 * recency_weight
        + 0.10 * user_rating.
      operationId: retrieveStacks
      tags: [retrieval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
      responses:
        '200':
          description: Ranked retrieval results with weighting formula
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'

  /v1/dashboard/acceptance:
    get:
      summary: Acceptance rate dashboard
      description: |
        Returns a full matrix of all core types × all style clusters with
        acceptance rates (applied / suggested, 0.0–1.0).
      operationId: acceptanceDashboard
      tags: [dashboard]
      responses:
        '200':
          description: Acceptance rate matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceDashboardResponse'

  /v1/events/suggest:
    post:
      summary: Record a stack suggestion
      description: Record that a stack was suggested for acceptance-rate tracking.
      operationId: recordSuggestion
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceEventRequest'
      responses:
        '200':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRecordResponse'

  /v1/events/apply:
    post:
      summary: Record a stack application
      description: Record that a stack was applied for acceptance-rate tracking.
      operationId: recordApplication
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceEventRequest'
      responses:
        '200':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRecordResponse'

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable error code.

    HealthResponse:
      type: object
      required: [status, modelLoaded, uptime]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        modelLoaded:
          type: boolean
          description: Whether the CLIP model has finished loading.
        model:
          type: string
          example: clip-vit-base-patch32
        uptime:
          type: integer
          minimum: 0
          description: Seconds since the service started.

    FeatureExtractRequest:
      type: object
      required: [images]
      properties:
        images:
          type: array
          description: List of image paths or base64-encoded image data.
          items:
            type: object
            required: [data]
            properties:
              data:
                type: string
                description: Base64-encoded image bytes (JPEG/PNG/WebP).
        includeTokens:
          type: boolean
          description: Return per-token embeddings (heavier payload).
          default: false

    ImageEmbedding:
      type: object
      required: [id, vector]
      properties:
        id:
          type: string
          description: Identifier for the image (provided by caller).
        vector:
          type: array
          items:
            type: number
          description: Pooled CLIP image embedding (normalized).
        tokens:
          type: array
          description: Per-token embeddings (present when includeTokens is true).
          items:
            type: array
            items:
              type: number

    FeatureExtractResponse:
      type: object
      required: [embeddings]
      properties:
        embeddings:
          type: array
          items:
            $ref: '#/components/schemas/ImageEmbedding'

    Hypothesis:
      type: object
      required: [id, effectStack, rationale]
      properties:
        id:
          type: string
          description: Stable identifier for the hypothesis.
        effectStack:
          type: array
          description: Proposed effect-stack (see effect-stack.schema.json).
          items:
            type: object
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Internal model confidence (0–1).
        rationale:
          type: string
          description: Natural-language explanation of why this hypothesis was chosen.
        estimatedPasses:
          type: integer
          minimum: 0
          description: Estimated GPU pass budget (see packages/schema estimatePasses).

    HypothesisRequest:
      type: object
      required: [features]
      properties:
        features:
          type: array
          description: Reference image embeddings to generate hypotheses for.
          items:
            $ref: '#/components/schemas/ImageEmbedding'
        count:
          type: integer
          minimum: 1
          maximum: 32
          default: 5
          description: Maximum number of hypotheses to generate.
        constraints:
          type: object
          description: Optional render constraints.
          properties:
            maxPasses:
              type: integer
              default: 8
              description: Mobile pass budget cap.

    HypothesisResponse:
      type: object
      required: [hypotheses]
      properties:
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/Hypothesis'

    PresetScoreRequest:
      type: object
      required: [preset, features]
      properties:
        preset:
          type: object
          description: Effect-stack preset to score.
        features:
          type: array
          description: Reference image embeddings.
          items:
            $ref: '#/components/schemas/ImageEmbedding'

    PresetScoreResponse:
      type: object
      required: [score, similarity, estimatedPasses, mobileOk]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Composite score (similarity weighted).
        similarity:
          type: number
          minimum: -1
          maximum: 1
          description: Mean cosine similarity between preset projection and references.
        estimatedPasses:
          type: integer
          minimum: 0
        mobileOk:
          type: boolean
          description: Whether the preset fits the ≤ 8-pass mobile budget.
        mobileBudget:
          type: integer
          description: Maximum GPU passes allowed on mobile.

    FeatureVector:
      type: object
      required: [palette, edges, frequency, tone]
      properties:
        palette:
          type: array
          items:
            type: array
            items:
              type: integer
          description: Dominant RGB colors sorted by frequency.
        edges:
          type: object
          description: Edge statistics with magnitude, direction, edge_density.
        frequency:
          type: object
          description: Frequency energy ratios with low, mid, high.
        tone:
          type: object
          description: Tone statistics with mean, std, histogram.
        clip_embedding:
          type: array
          items:
            type: number
          nullable: true
          description: 512-dim CLIP embedding (optional).

    VLMRefineRequest:
      type: object
      required: [feature, candidates]
      properties:
        feature:
          $ref: '#/components/schemas/FeatureVector'
        candidates:
          type: array
          description: Optional candidate cores to refine.
          items:
            type: object

    VLMRefineResponse:
      type: object
      required: [refined_candidates, overall_confidence, vlm_summary]
      properties:
        refined_candidates:
          type: array
          items:
            type: object
        overall_confidence:
          type: number
          minimum: 0
          maximum: 1
        vlm_summary:
          type: string
        image_description:
          type: string
          nullable: true
        feature_summary:
          type: object
        style_cluster:
          type: string

    VLMRegenerateResponse:
      type: object
      required: [regenerated_core, stack, score]
      properties:
        original_core:
          type: string
        original_params:
          type: object
        regenerated_core:
          type: string
        regenerated_params:
          type: object
        stack:
          type: array
          items:
            type: object
        score:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
        reasoning:
          type: string
        passes:
          type: integer

    VLMSuggestResponse:
      type: object
      required: [alternatives, count]
      properties:
        alternatives:
          type: array
          items:
            type: object
        count:
          type: integer
        current_stack_passes:
          type: integer
        current_stack_score:
          type: number
        target_cluster:
          type: string
        style_clusters:
          type: array
          items:
            type: string

    VLMOptimizeResponse:
      type: object
      required: [optimized_stack, score, passes, mobile_ok]
      properties:
        optimized_stack:
          type: array
          items:
            type: object
        score:
          type: number
        trace:
          type: array
          items:
            type: number
        passes:
          type: integer
        params_count:
          type: integer
        pruned_stack:
          type: array
          items:
            type: object
        pruned_passes:
          type: integer
        pruned_fidelity:
          type: number
        layers_removed_pct:
          type: number
        mobile_ok:
          type: boolean

    StyleClustersResponse:
      type: object
      properties:
        clusters:
          type: array
          items:
            type: string

    CoreTypesResponse:
      type: object
      properties:
        core_types:
          type: array
          items:
            type: string

    RetrieveRequest:
      type: object
      required: [feature]
      properties:
        feature:
          $ref: '#/components/schemas/FeatureVector'
        k:
          type: integer
          default: 10

    RetrieveResponse:
      type: object
      required: [results, count, weighting_formula]
      properties:
        results:
          type: array
          items:
            type: object
        count:
          type: integer
        weighting_formula:
          type: string

    AcceptanceDashboardResponse:
      type: object
      required: [acceptance_rates, core_types, style_clusters]
      properties:
        acceptance_rates:
          type: object
          description: Dict of core_type to dict of cluster to rate.
        core_types:
          type: array
          items:
            type: string
        style_clusters:
          type: array
          items:
            type: string
        description:
          type: string

    AcceptanceEventRequest:
      type: object
      required: [core_type, cluster]
      properties:
        core_type:
          type: string
        cluster:
          type: string

    EventRecordResponse:
      type: object
      properties:
        status:
          type: string
        event:
          type: string
