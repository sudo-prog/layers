<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAYERS Desktop — rounded rail mockups</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   LAYERS DESKTOP — ROUNDED RAIL MOCKUPS

   A SEPARATE file. `apps/LAYERS_DESKTOP` is untouched — this explores an idea
   against the existing graphite system.

   The brief, corrected:
     · the design is for LAYERS Desktop, not a new app
     · the side rails are ROUNDED on all four corners, but stay FLUSH to the
       canvas — a rounded corner at the window's outer edge
     · the panels COLLAPSE to an icon rail and EXPAND back on demand
     · menus slide out from underneath, not off a trigger

   Tokens are the graphite system's, unchanged. See docs/design-graphite.md.
   ═══════════════════════════════════════════════════════════════════════════ */

:root,
[data-theme="dark"] {
  --bg-primary: #0a0b0d;
  --bg-secondary: #101215;
  --bg-tertiary: #16191d;
  --bg-raised: #1c2026;
  --border: #262b33;
  --border-strong: #363c46;

  --text-primary: #f2f4f7;
  --text-secondary: #9aa3af;
  --text-tertiary: #8b95a3;

  --accent: #7aa2ff;
  --accent-hover: #9ab8ff;

  --panel-alpha: 0.74;
  --chrome-alpha: 0.80;
  --glass-blur: 32px;
  --glass-saturate: 1.25;
  --glass-brightness: 0.45;
  --surface-panel: rgb(16 18 21 / 0.74);
  --surface-chrome: rgb(10 11 13 / 0.80);

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 15px;
  --text-lg: 18px;

  --duration-fast: 130ms;
  --duration: 220ms;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);

  /* ── The one new radius in this file. The graphite system has no rounded
     surface at all, so this is a deliberate, isolated addition. */
  --r-rail: 16px;
  --r-rail-outer: 20px;

  --panel-left-w: 264px;
  --panel-right-w: 316px;
  --rail-w: 56px;
  --topbar-h: 44px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--text-base);
  line-height: 1.45;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
.icon { width: 16px; height: 16px; flex: 0 0 auto; color: currentColor; }

#app { display: flex; flex-direction: column; height: 100%; }

/* ══════════════════════════════════════════════════════════════════════════
   THE TOP BAR
   ══════════════════════════════════════════════════════════════════════════ */

.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-3);
  background: var(--surface-chrome);
  border-bottom: 1px solid var(--border);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  position: relative;
  z-index: 3;
}

.topbar-left, .topbar-right {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
}

.logo {
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--accent);
}

.topbar-sep { width: 1px; height: 18px; background: var(--border); }

.topbar-name {
  font: inherit;
  font-size: var(--text-sm);
  color: var(--text-secondary);
  padding: 3px var(--space-2);
  border-radius: 4px;
}
.topbar-name:hover { background: rgb(255 255 255 / 0.05); color: var(--text-primary); }

.topbar-chip {
  font: inherit;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  background: rgb(255 255 255 / 0.04);
  border: 1px solid var(--border);
  padding: 3px var(--space-2);
  border-radius: 5px;
  white-space: nowrap;
}
.topbar-chip.is-static { color: var(--text-tertiary); cursor: default; }
.topbar-chip:not(.is-static):hover { color: var(--text-primary); border-color: var(--border-strong); }

.topbar-readout {
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
  min-width: 38px;
  text-align: center;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  padding: 0;
  color: var(--text-secondary);
  background: none;
  border: 1px solid transparent;
  border-radius: 5px;
}
.icon-btn:hover { color: var(--text-primary); background: rgb(255 255 255 / 0.06); border-color: var(--border); }
.icon-btn .icon { width: 15px; height: 15px; }

/* ══════════════════════════════════════════════════════════════════════════
   THE BODY — three columns
   ══════════════════════════════════════════════════════════════════════════ */

.body {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
}

/* ── The rails. This is the one new idea.

   Rounded on ALL FOUR corners — including the two that sit against the canvas.
   The rail therefore reads as a rounded slab, not a square column, but it stays
   FLUSH to the canvas: its box still spans to the canvas edge, so the rounded
   corners are the window's outer edge at top and bottom, and a rounded edge
   against the canvas at the inner side.

   `overflow: hidden` would clip the rounded corners of anything painted over
   them, so the corner rounding is done on the panel itself and its own children
   are kept inside it. */
.panel {
  position: relative;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface-panel);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  z-index: 2;
  border-radius: var(--r-rail);
}

.panel-left  { width: var(--panel-left-w);  border-right: 1px solid var(--border); }
.panel-right { width: var(--panel-right-w); border-left: 1px solid var(--border); }

/* The outer corners take the larger radius, the inner corners the smaller —
   concentric with the window corner. */
.panel-left  { border-top-left-radius: var(--r-rail-outer); border-bottom-left-radius: var(--r-rail-outer); }
.panel-right { border-top-right-radius: var(--r-rail-outer); border-bottom-right-radius: var(--r-rail-outer); }

/* ── Collapsed: the rail becomes an icon strip.

   The rail is 56px, the rounded corners stay, and the labels are removed. The
   rail does not move and the canvas does not reflow — the panel's box is fixed
   and only its CONTENT changes, so expanding is a reveal rather than a shift. */
.panel.is-collapsed {
  width: var(--rail-w);
}
.panel.is-collapsed .panel-body,
.panel.is-collapsed .panel-footer,
.panel.is-collapsed .inspector { display: none; }
.panel.is-collapsed .panel-title { display: none; }

.panel-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3) var(--space-2);
}

.panel-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}

/* ── The collapse toggle. Icon-only, as the density rules require, but it keeps
   a real text node so it stays nameable. */
.collapse-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 4px;
  color: var(--text-tertiary);
}
.collapse-btn:hover { background: rgb(255 255 255 / 0.06); color: var(--text-primary); }
.collapse-btn .icon { width: 13px; height: 13px; transition: transform var(--duration) var(--ease); }

.panel.is-collapsed .collapse-btn .icon { transform: rotate(180deg); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
}

.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-2) var(--space-3); }

/* ── The collapsed rail's icon list */
.rail-icons {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-2) 0;
}
.panel.is-collapsed .rail-icons { display: flex; }

.rail-icon-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--text-tertiary);
}
.rail-icon-btn:hover { background: rgb(255 255 255 / 0.06); color: var(--text-primary); }
.rail-icon-btn.is-active { color: var(--accent); background: rgb(122 162 255 / 0.14); }

/* ── Rows */
.tree-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  padding: 5px var(--space-2);
  font: inherit;
  font-size: var(--text-sm);
  color: var(--text-secondary);
  border-radius: 5px;
  min-width: 0;
}
.tree-row:hover { background: rgb(255 255 255 / 0.05); color: var(--text-primary); }
.tree-row.is-active { background: rgb(122 162 255 / 0.16); color: var(--text-primary); }
.tree-row.is-active .tree-row-icon { color: var(--accent); }
.tree-row-icon { display: inline-flex; color: var(--text-tertiary); }
.tree-row-name {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tree-row.is-hidden .tree-row-name { opacity: 0.45; text-decoration: line-through; }

.panel-footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  padding: var(--space-2) var(--space-4);
  border-top: 1px solid var(--border);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
}

/* ── Props internals */
.inspector { padding: 0 var(--space-3) var(--space-6); }

.prop-section { border-top: 1px solid var(--border); }

.section-head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  padding: var(--space-2) var(--space-1);
  font: inherit;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.section-head:hover { color: var(--text-secondary); }

.section-body { display: flex; flex-direction: column; gap: 2px; padding-bottom: var(--space-3); }
.prop-section.is-closed .section-body { display: none; }

.ctl {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 32px;
  min-width: 0;
}
.ctl-label {
  flex: 0 0 88px;
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ctl-range { flex: 1; min-width: 0; height: 18px; accent-color: var(--accent); background: transparent; }
.ctl-value {
  flex: 0 0 46px;
  text-align: right;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
  white-space: nowrap;
}
.ctl-toggle {
  flex: 0 0 auto;
  width: 34px; height: 20px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-tertiary);
  position: relative;
  margin-left: auto;
}
.ctl-toggle-knob {
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--text-tertiary);
  transition: transform var(--duration-fast) var(--ease);
}
.ctl-toggle.is-on { background: var(--accent); border-color: var(--accent); }
.ctl-toggle.is-on .ctl-toggle-knob { background: #fff; transform: translateX(14px); }

/* ══════════════════════════════════════════════════════════════════════════
   THE CANVAS — full-bleed, so the panels glass over it
   ══════════════════════════════════════════════════════════════════════════ */

.canvas-area {
  flex: 1;
  min-width: 0;
  position: relative;
  z-index: 0;
  margin: 0 calc(-1 * (var(--panel-left-w) + var(--panel-right-w)));
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(130% 100% at 4% -12%, rgb(122 162 255 / 0.55) 0%, rgb(122 162 255 / 0.16) 34%, transparent 66%),
    radial-gradient(100% 85% at 102% 110%, rgb(122 162 255 / 0.38) 0%, rgb(122 162 255 / 0.08) 40%, transparent 64%),
    var(--bg-primary);
}

.stage {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(calc(-50% + (var(--panel-left-w) - var(--panel-right-w)) / 2), -50%);
}

.frame {
  width: 340px; height: 191px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 24px 64px -12px rgb(0 0 0 / 0.7);
  background: linear-gradient(155deg, #2b3038 0%, #1d2025 55%, #262a31 100%);
}

.frame-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 1px;
  width: 100%; height: 100%;
  opacity: 0.5;
}
.frame-grid i { background: rgba(255,255,255,0.05); }

.canvas-readout {
  position: absolute;
  bottom: var(--space-3);
  left: var(--space-3);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
}

/* ══════════════════════════════════════════════════════════════════════════
   THE SHEETS — rounded menus that slide out from underneath

   The brief: menus that slide out from underneath the canvas. Three planes:
   canvas z=0 → sheet z=1 → top bar z=3.

   The sheet hangs from a toolbar edge, not from a trigger button. Because the
   hidden state is translateY(-12px) rather than opacity alone, the open is a
   genuine slide out from underneath the plane.

   The sheet is ROUNDED — the same radius as the rails, so it reads as the same
   material family rather than as a floating foreign object.
   ══════════════════════════════════════════════════════════════════════════ */

.sheet-band {
  position: absolute;
  top: var(--topbar-h);
  left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 1;
}

.sheet {
  position: absolute;
  top: 0;
  pointer-events: auto;
  width: 248px;
  max-height: min(420px, 62vh);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: var(--space-2);
  background: var(--surface-chrome);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  border: 1px solid var(--border-strong);
  border-top: 0;
  border-radius: 0 0 var(--r-rail) var(--r-rail);
  box-shadow: 0 24px 60px -12px rgb(0 0 0 / 0.75);
  opacity: 0;
  transform: translateY(-12px);
  transform-origin: top center;
  visibility: hidden;
  transition:
    opacity var(--duration-fast) var(--ease),
    transform var(--duration) var(--ease),
    visibility 0s linear var(--duration);
}

.sheet.is-open {
  opacity: 1;
  transform: translateY(0);
  visibility: visible;
  transition:
    opacity var(--duration-fast) var(--ease),
    transform var(--duration) var(--ease),
    visibility 0s;
}

.sheet-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 7px var(--space-2);
  font-size: var(--text-sm);
  color: var(--text-secondary);
  border-radius: 6px;
}
.sheet-item:hover { background: rgb(255 255 255 / 0.06); color: var(--text-primary); }
.sheet-item.is-active { color: var(--accent); background: rgb(122 162 255 / 0.14); }
.sheet-item .icon { width: 14px; height: 14px; color: var(--text-tertiary); }
.sheet-item.is-active .icon { color: var(--accent); }
.sheet-item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-item-meta { flex: 0 0 auto; font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--text-tertiary); }
.sheet-divider { height: 1px; margin: var(--space-1) var(--space-2); background: var(--border); }

/* ══════════════════════════════════════════════════════════════════════════
   THE INSERT BAR
   ══════════════════════════════════════════════════════════════════════════ */

.insert-host {
  position: absolute;
  left: 50%;
  bottom: var(--space-4);
  transform: translateX(-50%);
  z-index: 5;
  pointer-events: none;
}
.insert-host > * { pointer-events: auto; }

.insert-bar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface-chrome);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(var(--glass-brightness));
  box-shadow: 0 12px 32px -8px rgb(0 0 0 / 0.55);
}

.insert-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 var(--space-3);
  font: inherit;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  border-radius: 999px;
  white-space: nowrap;
  flex: 0 0 auto;
}
.insert-btn:hover { background: rgb(255 255 255 / 0.06); color: var(--text-primary); }
.insert-btn.is-open { background: rgb(122 162 255 / 0.18); color: var(--text-primary); }
.insert-btn-label { white-space: nowrap; }

/* ══════════════════════════════════════════════════════════════════════════
   THE VARIANT SWITCHES — a mockup file, so the states are switchable
   ══════════════════════════════════════════════════════════════════════════ */

.variant-bar {
  position: fixed;
  right: var(--space-5);
  bottom: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: 10px;
  background: var(--surface-chrome);
  border: 1px solid var(--border-strong);
  box-shadow: 0 24px 60px -12px rgb(0 0 0 / 0.75);
  z-index: 50;
}

.variant-bar-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}

.variant-group { display: flex; gap: 4px; }

.variant-btn {
  padding: 5px var(--space-3);
  border-radius: 5px;
  font-size: var(--text-xs);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.variant-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }
.variant-btn[aria-pressed="true"] { background: rgb(122 162 255 / 0.16); color: var(--accent); border-color: var(--accent); }

@media (max-width: 1180px) {
  :root { --panel-left-w: 224px; --panel-right-w: 272px; }
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">LAYERS</span>
      <span class="topbar-sep" aria-hidden="true"></span>
      <button class="topbar-name">Untitled</button>
      <span class="topbar-sep" aria-hidden="true"></span>
      <button class="topbar-chip" data-sheet="sheet-dims" aria-expanded="false" aria-controls="sheet-dims">1920 × 1080</button>
    </div>
    <div class="topbar-right">
      <span class="topbar-chip is-static">P3 Linear</span>
      <span class="topbar-chip is-static">ACES Filmic</span>
      <span class="topbar-sep" aria-hidden="true"></span>
      <button class="topbar-chip" data-sheet="sheet-zoom" aria-expanded="false" aria-controls="sheet-zoom">100%</button>
      <span class="topbar-sep" aria-hidden="true"></span>
      <button class="icon-btn" aria-label="Toggle theme">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <div class="body">

    <!-- ══ THE SHEETS. Child of .body, sibling of the panels — never inside a
         stacking context or a blurred surface. ══ -->
    <div class="sheet-band" id="sheets">
      <div class="sheet" id="sheet-dims" role="menu" aria-label="Canvas dimensions">
        <button class="sheet-item is-active" role="menuitem"><span class="sheet-item-label">1920 × 1080</span><span class="sheet-item-meta">FHD</span></button>
        <button class="sheet-item" role="menuitem"><span class="sheet-item-label">2560 × 1440</span><span class="sheet-item-meta">QHD</span></button>
        <button class="sheet-item" role="menuitem"><span class="sheet-item-label">3840 × 2160</span><span class="sheet-item-meta">4K</span></button>
        <div class="sheet-divider" role="separator"></div>
        <button class="sheet-item" role="menuitem"><span class="sheet-item-label">1080 × 1920</span><span class="sheet-item-meta">Story</span></button>
        <button class="sheet-item" role="menuitem"><span class="sheet-item-label">1080 × 1080</span><span class="sheet-item-meta">Square</span></button>
      </div>
      <div class="sheet" id="sheet-zoom" role="menu" aria-label="Zoom">
        <button class="sheet-item" role="menuitem"><span class="sheet-item-label">25%</span></button>
        <button class="sheet-item" role="menuitem"><span class="sheet-item-label">50%</span></button>
        <button class="sheet-item is-active" role="menuitem"><span class="sheet-item-label">100%</span></button>
        <button class="sheet-item" role="menuitem"><span class="sheet-item-label">200%</span></button>

<!-- Variant switches: mockup-only, kept small and out of the composition -->
<div class="variant-bar" role="group" aria-label="Mockup variants">

  <div class="variant-group">
    <button class="variant-btn" data-variant="expanded" aria-pressed="true">Rails open</button>
    <button class="variant-btn" data-variant="collapsed" aria-pressed="false">Icon rails</button>
  </div>
  <div class="variant-group">
    <button class="variant-btn" data-variant="flat" aria-pressed="false">Flat corners</button>
    <button class="variant-btn" data-variant="rounded" aria-pressed="true">Rounded</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── Rails collapse and expand. The panel's box does not change width, so the
     canvas does not reflow — expanding is a reveal rather than a shift, which
     keeps the canvas frame pinned where the user left it. */
  document.querySelectorAll(".collapse-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var rail = document.getElementById(btn.getAttribute("data-rail"));
      if (!rail) return;
      var collapsed = rail.classList.toggle("is-collapsed");
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.setAttribute("title", collapsed ? "Expand panel" : "Collapse panel");
      var label = btn.querySelector(".sr-only");
      if (label) label.textContent = (collapsed ? "Expand " : "Collapse ") + (rail.id === "rail-left" ? "Shaders" : "Props") + " panel";
    });
  });

  /* ── Sheets. One open at a time. */
  var sheetTriggers = Array.prototype.slice.call(document.querySelectorAll("[data-sheet]"));
  var openSheet = null;

  function closeSheets() {
    if (!openSheet) return;
    var s = document.getElementById(openSheet);
    if (s) s.classList.remove("is-open");
    var t = document.querySelector('[data-sheet="' + openSheet + '"]');
    if (t) t.setAttribute("aria-expanded", "false");
    openSheet = null;
  }
  function openSheet(id) {
    if (openSheet === id) { closeSheets(); return; }
    closeSheets();
    var s = document.getElementById(id);
    var t = document.querySelector('[data-sheet="' + id + '"]');
    if (!s || !t) return;
    s.classList.add("is-open");
    t.setAttribute("aria-expanded", "true");
    openSheet = id;
  }
  sheetTriggers.forEach(function (t) {
    t.addEventListener("click", function (e) { e.stopPropagation(); openSheet(t.getAttribute("data-sheet")); });
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".sheet") && !e.target.closest("[data-sheet]")) closeSheets();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheets(); });

  /* Anchor each sheet under its trigger, clamped inside the body. */
  function anchorSheets() {
    var body = document.querySelector(".body");
    if (!body) return;
    var br = body.getBoundingClientRect();
    sheetTriggers.forEach(function (t) {
      var s = document.getElementById(t.getAttribute("data-sheet"));
      if (!s) return;
      var w = s.getBoundingClientRect().width || 248;
      var left = t.getBoundingClientRect().left - br.left;
      var maxLeft = br.width - w - 8;
      s.style.left = Math.round(Math.max(8, Math.min(left, Math.max(8, maxLeft)))) + "px";
    });
  }
  window.addEventListener("resize", anchorSheets);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(anchorSheets);
  window.addEventListener("load", anchorSheets);
  anchorSheets();

  /* ── Variants. Rounded vs flat corners, and rails open vs collapsed. */
  var root = document.documentElement;

  function setVariant(kind, value) {
    var btns = document.querySelectorAll('[data-variant="' + kind + '"]');
    btns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-variant") === value && b.textContent.trim().toLowerCase().indexOf(value === "flat" ? "flat" : value === "collapsed" ? "icon" : value === "expanded" ? "open" : "rounded") !== -1)); });
  }

  document.querySelectorAll('[data-variant="collapsed"], [data-variant="expanded"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      var collapse = btn.getAttribute("data-variant") === "collapsed";
      document.querySelectorAll(".panel").forEach(function (p) {
        p.classList.toggle("is-collapsed", collapse);
      });
      document.querySelectorAll(".collapse-btn").forEach(function (b) {
        b.setAttribute("aria-expanded", String(!collapse));
        b.setAttribute("title", collapse ? "Expand panel" : "Collapse panel");
      });
      document.querySelectorAll('[data-variant="collapsed"], [data-variant="expanded"]').forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
    });
  });

  document.querySelectorAll('[data-variant="flat"], [data-variant="rounded"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      var flat = btn.getAttribute("data-variant") === "flat";
      root.style.setProperty("--r-rail", flat ? "0px" : "16px");
      root.style.setProperty("--r-rail-outer", flat ? "0px" : "20px");
      document.querySelectorAll('[data-variant="flat"], [data-variant="rounded"]').forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
    });
  });
})();
</script>
