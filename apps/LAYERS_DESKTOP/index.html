<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>LAYERS Desktop — Visual Style Engine</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0b0d'/%3E%3C/svg%3E" />
    <!-- CSP is configured at the hosting/CDN level in production, not as a meta
         tag: a meta CSP blocks Vite's HMR eval() in dev mode. -->
    <link rel="stylesheet" href="/src/desktop.css" />
  </head>
  <body>
    <div id="app">
      <div class="base" aria-hidden="true"></div>

      <div class="body">
        <!-- ══ Left panel (rail), BEHIND the canvas ══ -->
        <aside class="panel panel-left" id="rail-left">
          <div class="panel-strip">
            <span class="logo">LAYERS</span>
            <span class="strip-sep" aria-hidden="true"></span>
            <button id="btn-project" class="strip-name" title="Rename project">Untitled</button>
            <button id="btn-dims" class="strip-chip" aria-expanded="false" title="Canvas dimensions">
              <span id="dims-label">1920 × 1080</span>
            </button>
            <button id="toggle-theme" class="strip-chip strip-chip--btn" title="Toggle theme" aria-label="Toggle theme">
              <svg class="icon" id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19" />
              </svg>
            </button>
          </div>

          <div class="panel-head">
            <span class="panel-title">Shaders</span>
            <button class="collapse-btn" data-rail="rail-left" aria-expanded="true" aria-controls="rail-left" title="Collapse panel">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
              <span class="sr-only">Collapse Shaders panel</span>
            </button>
          </div>

          <div class="rail-icons">
            <button class="rail-icon-btn is-active" aria-label="Shaders" title="Shaders">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 14 9 5 9-5"/></svg>
            </button>
            <button class="rail-icon-btn" aria-label="Layers" title="Layers">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16"/></svg>
            </button>
          </div>

          <section id="shader-tree" class="tree-section">
            <div class="panel-title panel-title--section">Shaders</div>
            <div class="tree-list" id="shader-list" role="listbox" aria-label="Shaders"></div>
          </section>

          <section id="stack-section" class="tree-section tree-section--grow">
            <div class="panel-title panel-title--section">Layers</div>
            <div class="tree-list tree-grow" id="stack-list" role="listbox" aria-label="Layers"></div>
          </section>

          <footer class="panel-footer">
            <span id="footer-passes" class="topbar-readout">0 passes</span>
            <span id="footer-fps" class="topbar-readout">— fps</span>
          </footer>
        </aside>

        <!-- ══ Right panel (rail), BEHIND the canvas ══ -->
        <aside class="panel panel-right" id="rail-right">
          <div class="panel-strip panel-strip--right">
            <button id="btn-pipeline" class="strip-chip strip-chip--btn" title="Colour pipeline">
              <span id="pipeline-label">P3 Linear</span>
            </button>
            <span class="strip-chip is-static" aria-hidden="true">ACES</span>
          </div>

          <div class="panel-head">
            <span class="panel-title">Props</span>
            <button class="collapse-btn" data-rail="rail-right" aria-expanded="true" aria-controls="rail-right" title="Collapse panel">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
              <span class="sr-only">Collapse Props panel</span>
            </button>
          </div>

          <div class="rail-icons">
            <button class="rail-icon-btn is-active" aria-label="Props" title="Props">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></svg>
            </button>
          </div>

          <div id="props-panel" class="inspector"></div>
        </aside>

        <!-- ══ Canvas window, ON TOP of the panels ══ -->
        <main class="canvas-card" id="canvas-card">
          <div class="canvas-head">
            <span id="canvas-meta">Canvas · 1920 × 1080</span>
            <span class="canvas-head-spacer" aria-hidden="true"></span>
            <button id="zoom-out" class="icon-btn icon-btn--small" title="Zoom out" aria-label="Zoom out">
              <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8 11h6"/></svg>
            </button>
            <span id="zoom-level" class="canvas-zoom">100%</span>
            <button id="zoom-in" class="icon-btn icon-btn--small" title="Zoom in" aria-label="Zoom in">
              <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/></svg>
            </button>
            <button id="zoom-fit" class="icon-btn icon-btn--small" title="Zoom to fit" aria-label="Zoom to fit">
              <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/></svg>
            </button>
          </div>

          <div class="canvas-body" id="canvas-viewport">
            <div id="frame" class="frame">
              <canvas id="gl-canvas"></canvas>
            </div>
            <div class="canvas-readout" aria-hidden="true"></div>

            <!-- The pill toolbar, floating on the canvas -->
            <div id="insert-host" class="insert-host">
              <div class="insert-bar" id="insert-bar" role="toolbar" aria-label="Add component"></div>
            </div>
          </div>
        </main>
      </div>

      <!-- The radius + nav mode bar (approved mockup control) -->
      <div class="radius-bar" role="group" aria-label="View controls">
        <span class="radius-bar-title">Radius</span>
        <div class="radius-group">
          <button class="radius-btn" data-radius="16" aria-pressed="false">16</button>
          <button class="radius-btn" data-radius="28" aria-pressed="true">28</button>
          <button class="radius-btn" data-radius="44" aria-pressed="false">44</button>
        </div>
        <span class="radius-bar-title" style="margin-left:8px">Panels</span>
        <button class="nav-btn" data-nav="expanded" aria-pressed="true">Expanded</button>
        <button class="nav-btn" data-nav="collapsed" aria-pressed="false">Navbar</button>
      </div>

      <!-- Component picker (centred sheet over the canvas) -->
      <div id="picker-scrim" class="picker-scrim hidden" role="dialog" aria-modal="true" aria-labelledby="picker-title">
        <div class="picker-sheet">
          <header class="picker-header">
            <h2 id="picker-title" class="picker-title">Textures</h2>
            <button id="picker-close" class="icon-btn" aria-label="Close picker" title="Close">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </header>

          <div class="picker-search-wrap">
            <input id="picker-search" class="picker-search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
          </div>

          <div id="picker-cats" class="picker-cats" role="tablist" aria-label="Categories"></div>

          <div id="picker-grid" class="picker-grid" role="listbox" aria-label="Components"></div>

          <footer class="picker-footer">
            <span id="picker-count" class="picker-count">0 components</span>
          </footer>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
