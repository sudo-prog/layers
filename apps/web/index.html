<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LAYERS — Visual Style Engine</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <h1 class="logo">LAYERS</h1>
      <div class="toolbar-actions">
        <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)" disabled aria-label="Undo">↩ Undo</button>
        <button id="btn-redo" class="btn" title="Redo (Ctrl+Y)" disabled>↪ Redo</button>
        <span class="divider"></span>
        <button id="btn-export" class="btn" title="Export preset JSON">Export</button>
        <button id="btn-import" class="btn" title="Import preset JSON">Import</button>
        <button id="btn-vector" class="btn" title="Vector Editor">✏️ Vector</button>
        <button id="btn-save" class="btn" title="Save to IndexedDB">💾 Save</button>
        <button id="btn-clear" class="btn" title="Clear IndexedDB">🗑 Clear</button>
        <span class="divider"></span>
        <button id="btn-theme" class="btn" title="Toggle theme">🌙 Dark</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel panel-left">
        <h2 class="panel-title">Cores</h2>
        <div id="core-list" class="core-list"></div>
      </aside>

      <section class="canvas-area">
        <div class="canvas-container">
          <canvas id="gl-canvas" width="512" height="512"></canvas>
          <canvas id="mask-canvas" width="512" height="512" class="mask-canvas hidden"></canvas>
          <div id="mask-overlay" class="mask-overlay hidden">
            <div class="mask-toolbar">
              <button id="btn-paint" class="btn active">🖌 Paint</button>
              <button id="btn-erase" class="btn">🧹 Erase</button>
              <button id="btn-clear-mask" class="btn">Clear</button>
              <button id="btn-close-mask" class="btn">✕ Close</button>
              <label>Size <input type="range" id="brush-size" min="1" max="200" value="20"></label>
              <label>Opacity <input type="range" id="brush-opacity" min="0" max="1" step="0.01" value="0.5"></label>
            </div>
          </div>
        </div>
        <div class="canvas-info">
          <span id="pass-count">0 passes</span>
          <span id="fps-display"></span>
        </div>
      </section>

      <aside class="panel panel-right">
        <h2 class="panel-title">Stack</h2>
        <div id="stack-list" class="stack-list"></div>
        <div id="inspector" class="inspector">
          <p class="inspector-empty">Select a core to edit its parameters</p>
          <button id="btn-mask" class="btn" style="display:none;width:100%;margin-top:8px;">🎭 Edit Mask</button>
        </div>
      </aside>
    </main>
  </div>

  <footer id="sync-status" class="sync-status">
    <span class="sync-indicator"></span>
    <span id="sync-text">Sync: --</span>
  </footer>

  <!-- Help overlay -->
  <div id="help-overlay" class="help-overlay" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
    <div class="help-modal">
      <button id="btn-close-help" class="help-close" aria-label="Close keyboard shortcuts">✕</button>
      <div id="help-content" class="help-content"></div>
    </div>
  </div>

  <!-- Vector editor panel -->
  <div id="vector-panel" class="vector-panel hidden">
    <div class="vector-header">
      <h3>Vector Editor</h3>
      <button id="btn-close-vector" class="btn">✕</button>
    </div>
    <div class="vector-toolbar">
      <button id="btn-add-point" class="btn">+ Point</button>
      <button id="btn-add-line" class="btn">+ Line</button>
      <button id="btn-add-curve" class="btn">+ Curve</button>
      <button id="btn-delete-point" class="btn">Delete</button>
      <button id="btn-new-path" class="btn">New Path</button>
      <span class="divider"></span>
      <button id="btn-zoom-out" class="btn">−</button>
      <button id="btn-zoom-in" class="btn">+</button>
      <span class="divider"></span>
      <button id="btn-export-svg" class="btn">Export</button>
      <button id="btn-import-svg" class="btn">Import</button>
    </div>
    <svg id="vector-svg" width="256" height="256" class="vector-svg"></svg>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
