name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify license register exists
        run: |
          if [ ! -f "docs/licenses.md" ]; then
            echo "ERROR: License register (docs/licenses.md) not found."
            echo "Every dependency must be documented in docs/licenses.md before merging."
            exit 1
          fi
      - name: Check licenses
        run: |
          # Verify against allow-listed licenses AND cross-check with the license register
          npx license-checker --production --csv | tail -n +2 | while IFS=',' read -r name version license; do
            case "$license" in
              MIT|BSD*|Apache*|ISC|Unlicense|CC0*|Public*Domain|WTFPL)
                ;;
              *)
                echo "DISALLOWED LICENSE: $name@$version - $license"
                exit 1
                ;;
            esac
            # Cross-check: package must appear in docs/licenses.md
            if ! grep -q "\`${name}\`" docs/licenses.md; then
              echo "ERROR: $name@$version is not documented in docs/licenses.md"
              echo "Add it to the register before merging."
              exit 1
            fi
          done
      - name: Check for BLOCKED licenses in client bundle
        run: |
          # Fail if any BLOCKED license appears in the dependency tree
          npx license-checker --production --csv | tail -n +2 | while IFS=',' read -r name version license; do
            case "$license" in
              AGPL*|SSPL*|PolyForm*|CC-BY-NC*|CC-BY-ND*|NonCommercial*)
                echo "BLOCKED LICENSE IN DEPENDENCY TREE: $name@$version - $license"
                exit 1
                ;;
            esac
          done

  conflict-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for sync-conflict files
        run: |
          if find . -name "*.sync-conflict-*" -not -path "./node_modules/*" | grep -q .; then
            echo "Sync-conflict files found:"
            find . -name "*.sync-conflict-*" -not -path "./node_modules/*"
            exit 1
          fi
      - name: Check for .env files
        run: |
          if find . -name ".env" -o -name ".env.*" | grep -v node_modules | grep -v ".example" | grep -q .; then
            echo ".env files found (not in gitignore):"
            find . -name ".env" -o -name ".env.*" | grep -v node_modules | grep -v ".example"
            exit 1
          fi

  ownership-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ownership
        run: bash .github/scripts/ownership-check.sh

  golden-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright + Chromium
        run: |
          cd tests/golden-infra
          pnpm install
          npx playwright install chromium --with-deps
      - name: Run golden-image tests
        run: |
          cd tests/golden-infra
          node scripts/run-all.js
        env:
          LAYERS_GOLDEN_THRESHOLD: 0.98
          LAYERS_GOLDEN_SEED: 42
