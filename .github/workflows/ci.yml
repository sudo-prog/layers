name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — saves runner minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Path filtering, done safely.
#
# The workflow still triggers on EVERY push and PR, so every job always reports a
# status. A `changes` job computes which areas actually moved and the heavy jobs
# skip when their area is untouched — a docs-only change no longer reinstalls
# Playwright/Chromium or runs the Python suite.
#
# Safety rule: if the diff cannot be computed, every flag defaults to TRUE, so a
# detection failure runs the full suite rather than silently skipping it.

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    outputs:
      js: ${{ steps.diff.outputs.js }}
      python: ${{ steps.diff.outputs.python }}
      golden: ${{ steps.diff.outputs.golden }}
      licenses: ${{ steps.diff.outputs.licenses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed areas
        id: diff
        env:
          # Passed via env, never interpolated into the script body — a crafted
          # branch name must not be able to inject shell commands.
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Validate the ref shape before using it (defence in depth).
            case "$BASE_REF" in
              *[!A-Za-z0-9._/-]*|"")
                echo "Refusing unexpected base ref; running full suite."
                RANGE=""
                ;;
              *)
                git fetch --no-tags origin "$BASE_REF" || true
                RANGE="origin/$BASE_REF...HEAD"
                ;;
            esac
          elif git rev-parse -q --verify HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1...HEAD"
          else
            RANGE=""
          fi

          CHANGED=""
          if [ -n "$RANGE" ]; then
            CHANGED=$(git diff --name-only "$RANGE" 2>/dev/null || true)
          fi

          if [ -n "$CHANGED" ]; then
            js=false; python=false; golden=false; licenses=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue

              # Golden-image tests render the REAL engine+cores pipeline, so a
              # change there must trigger them. These specific checks run BEFORE
              # the broad buckets — `case` stops at the first match, so a
              # catch-all listed first would silently swallow them.
              case "$f" in
                packages/engine/*|packages/cores/*|tests/golden-infra/*) golden=true ;;
              esac

              case "$f" in
                # CI itself changed -> run everything
                .github/*) js=true; python=true; golden=true; licenses=true ;;
                # Python service
                services/*) python=true ;;
                # JS/TS workspace
                apps/*|packages/*|tests/*|*.json|*.yaml|*.yml|*.ts|*.js|pnpm-lock.yaml|pnpm-workspace.yaml) js=true ;;
              esac

              # License register must track any dependency change (independent check)
              case "$f" in
                package.json|pnpm-lock.yaml|*/package.json) licenses=true ;;
              esac
            done <<< "$CHANGED"
          else
            # Could not compute a diff -> run everything (safe default)
            js=true; python=true; golden=true; licenses=true
          fi

          echo "Changed files in ${RANGE:-<none>}:"
          echo "${CHANGED:-<none>}"
          echo "-> js=$js python=$python golden=$golden licenses=$licenses"

          {
            echo "js=$js"
            echo "python=$python"
            echo "golden=$golden"
            echo "licenses=$licenses"
          } >> "$GITHUB_OUTPUT"

  lint-typecheck-test:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  license-check:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify license register exists
        run: |
          if [ ! -f "docs/licenses.md" ]; then
            echo "ERROR: License register (docs/licenses.md) not found."
            echo "Every dependency must be documented in docs/licenses.md before merging."
            exit 1
          fi
      - name: Check for BLOCKED licenses in dependency tree
        run: |
          # Fail if any BLOCKED license appears in the dependency tree (checked FIRST)
          npx license-checker --production --csv | tail -n +2 | while IFS=',' read -r name version license; do
            case "$license" in
              AGPL*|SSPL*|PolyForm*|CC-BY-NC*|CC-BY-ND*|NonCommercial*)
                echo "BLOCKED LICENSE: $name@$version - $license"
                exit 1
                ;;
            esac
          done
      - name: Check allow-listed licenses
        run: |
          # Verify against allow-listed licenses AND cross-check with the license register
          npx license-checker --production --csv | tail -n +2 | while IFS=',' read -r name version license; do
            case "$license" in
              MIT|BSD*|Apache*|ISC|Unlicense|CC0*|Public*Domain|WTFPL)
                ;;
              *)
                echo "DISALLOWED LICENSE: $name@$version - $license"
                exit 1
                ;;
            esac
            # Cross-check: package must appear in docs/licenses.md
            if ! grep -q "\`${name}\`" docs/licenses.md; then
              echo "ERROR: $name@$version is not documented in docs/licenses.md"
              echo "Add it to the register before merging."
              exit 1
            fi
          done

  # Cheap and always relevant — never gated.
  conflict-files:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for sync-conflict files
        run: |
          if find . -name "*.sync-conflict-*" -not -path "./node_modules/*" | grep -q .; then
            echo "Sync-conflict files found:"
            find . -name "*.sync-conflict-*" -not -path "./node_modules/*"
            exit 1
          fi
      - name: Check for .env files
        run: |
          if find . -name ".env" -o -name ".env.*" | grep -v node_modules | grep -v ".example" | grep -q .; then
            echo ".env files found (not in gitignore):"
            find . -name ".env" -o -name ".env.*" | grep -v node_modules | grep -v ".example"
            exit 1
          fi

  # Cheap and always relevant — never gated.
  ownership-check:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ownership
        run: bash .github/scripts/ownership-check.sh

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd services/ai
          pip install -r requirements.txt
          pip install pytest httpx2 Pillow python-multipart
      - name: Run Python tests
        run: |
          cd services/ai
          python -m pytest tests/ -v
        env:
          LAYERS_AI_TOKEN: dev-token

  golden-image:
    needs: changes
    if: needs.changes.outputs.golden == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build engine + cores (golden tests render the real pipeline)
        run: pnpm build --filter @layers/engine --filter @layers/cores
      - name: Install Playwright + Chromium
        run: |
          cd tests/golden-infra
          pnpm install
          npx playwright install chromium
      - name: Run golden-image tests (legacy fixtures)
        run: |
          cd tests/golden-infra
          node scripts/run-all.js
        env:
          LAYERS_GOLDEN_THRESHOLD: 0.98
          LAYERS_GOLDEN_SEED: 42
      - name: Run per-core golden tests (real @layers/cores + effect-presence guard)
        run: |
          cd tests/golden-infra
          node scripts/cores-golden.js --verify
        env:
          LAYERS_GOLDEN_THRESHOLD: 0.98
          LAYERS_GOLDEN_SEED: 42
      - name: Run multi-look coverage gate (>= 6 distinct looks per core)
        run: |
          cd tests/golden-infra
          node scripts/cores-looks.js
        env:
          LAYERS_GOLDEN_THRESHOLD: 0.98
          LAYERS_GOLDEN_SEED: 42
