name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check licenses
        run: |
          # Only allow-list licenses
          npx license-checker --production --csv | tail -n +2 | while IFS=',' read -r name version license; do
            case "$license" in
              MIT|BSD*|Apache*|ISC|Unlicense|CC0*|Public*Domain|WTFPL)
                ;;
              *)
                echo "DISALLOWED LICENSE: $name@$version - $license"
                exit 1
                ;;
            esac
          done

  conflict-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for sync-conflict files
        run: |
          if find . -name "*.sync-conflict-*" -not -path "./node_modules/*" | grep -q .; then
            echo "Sync-conflict files found:"
            find . -name "*.sync-conflict-*" -not -path "./node_modules/*"
            exit 1
          fi
      - name: Check for .env files
        run: |
          if find . -name ".env" -o -name ".env.*" | grep -v node_modules | grep -v ".example" | grep -q .; then
            echo ".env files found (not in gitignore):"
            find . -name ".env" -o -name ".env.*" | grep -v node_modules | grep -v ".example"
            exit 1
          fi

  ownership-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ownership
        run: |
          # This would need a script to check changed files vs CODEOWNERS
          # For now, just a placeholder
          echo "Ownership check placeholder"
